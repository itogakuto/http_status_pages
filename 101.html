<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Status</title>
    <style>
        :root{
            --bg:#f5f0e8;
            --ink:#2d2925;
            --muted:#756b61;
            --line:#2d2925;
            --paper:#fffaf2;
            --a:#caa889;
            --b:#efdcb9;
            --g:#798a58;
            --err:#d7b8a7
        }
        *{box-sizing:border-box}html,
        body{height:100%}
        body{
            margin:0;
            background:radial-gradient(circle at 1px 1px,#2d29250a 1px,transparent 0) 0 0/18px 18px,var(--bg);
            color:var(--ink);
            font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
            overflow:hidden
        }
        .wrap{
            min-height:100%;
            display:grid;
            place-items:center;
            padding:clamp(18px,4vw,52px)}main{width:min(100%,980px);
            display:grid;
            gap:clamp(18px,3vw,32px);
            grid-template-columns:minmax(0,1fr);
            align-items:center
        }
        .card{
            position:relative;
            isolation:isolate;
            border:1px solid #2d29252e;
            background:linear-gradient(180deg,#fffaf2d9,#f7eee2cc);
            box-shadow:0 30px 90px #2d292514;
            border-radius:28px;
            padding:clamp(24px,5vw,54px);
            overflow:hidden
        }
        .card:before{
            content:"";
            position:absolute;
            inset:16px;
            border:1px dashed #2d292524;
            border-radius:20px;
            z-index:-1
        }
        .head{
            display:flex;
            justify-content:space-between;
            gap:16px;
            align-items:flex-start;
            margin-bottom:8px;
        }
        .brand,
        .code{
            font-size:12px;
            letter-spacing:.08em;
            text-transform:uppercase;
            color:var(--muted);
        }
        .code{
            font-weight:800;
            color:var(--ink);
        }
        .hero{
            display:grid;
            grid-template-columns:1fr;
            gap:22px;
            align-items:center;
        }
        .text{
            max-width:590px;
        }
        .num{
            font-size:clamp(72px,3vw,180px);
            line-height:.8;
            letter-spacing:-.08em;
            margin:0 0 12px;
            font-weight:900;
        }
        .num span{
            display:inline-block;
            transform:translateX(-.04em);
        }
        h1{
            font-size:clamp(24px,2.3vw,52px);
            line-height:1.05;
            letter-spacing:-.05em;
            margin:0 0 14px
        }
        p{
            font-size:clamp(14px,1.7vw,17px);
            line-height:1.9;
            margin:0;
            color:var(--muted)
        }
        .artbox{
            position:relative;
            min-height:clamp(260px,40vw,430px);
            display:grid;
            place-items:center
        }
        canvas{
            width:100%;
            max-width:720px;
            aspect-ratio:16/9;
            image-rendering:pixelated
        }
        .note{
            position:fixed;
            right:16px;
            bottom:14px;
            font-size:11px;
            letter-spacing:.1em;
            color:#2d29255c
        }
        .hide{
            display:none
            }
        @media (min-width:780px){
            .hero{
                grid-template-columns:.95fr 1.05fr
            }
            .artbox{
                min-height:410px
            }
            .text{
                align-self:center;
            }
        }
        @media (max-height:720px){
            body{
                overflow:auto
            }
            .wrap{
                place-items:start center
            }
        }
        @media (prefers-reduced-motion:no-preference){
            .card{
                animation:rise .7s cubic-bezier(.22,1,.36,1) both
            }
            @keyframes rise{from{
                opacity:0;
                transform:translateY(12px)
            }to{
                opacity:1;
                transform:none
            }
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <main class="card" aria-live="polite">
        <div class="head">
            <div class="brand">STATUS PAGE</div>
            <div class="code" id="smallCode">101 SWITCHING PROTOCOLS</div>
        </div>
            <section class="hero">
                <div class="text">
                    <p class="brand" id="eyebrow">HTTP STATUS</p>
                        <h2 class="num" id="num"><span>101</span></h2>
                        <h1 id="title">罠より猟銃の方が、安全に仕留められます。</h1>
                    <p id="message">通信方法を変更します。</p>
                </div>
                <div class="artbox"><canvas id="art" width="960" height="540" aria-label="ドット絵の銃"></canvas></div>
            </section>
        </main>
    </div>
    <div class="note">single html / no image</div>
    <script>
        (()=>{
            const txt={
                101:["101 SWITCHING PROTOCOLS","罠より猟銃の方が、安全に仕留められます。","通信方法を変更します。"]
            };
            const raw=
                (location.search+location.hash+location.pathname).toLowerCase(),status=101;
            const 
                el=id=>document.getElementById(id);
                el("smallCode").textContent=txt[status][0];
                el("eyebrow").textContent="HTTP STATUS";
                el("num").innerHTML="<span>"+status+"</span>";
                el("title").textContent=txt[status][1];
                el("message").textContent=txt[status][2];
                document.title=status+" - "+txt[status][0];
            const 
                cv=document.getElementById("art"),
                c=cv.getContext("2d"),
                C={
                    ink:"#2d2925",
                    body:"#caa889",
                    body2:"#d7b993",
                    light:"#efdcb9",
                    grass:"#798a58",
                    paper:"#fffaf2",
                    err:"#d7b8a7",
                    mute:"#756b61"
                };
            let W=960,H=540,S=8,OX=0,OY=0,T=0;

            function size(){
                const 
                    r=cv.getBoundingClientRect(),
                    d=devicePixelRatio||1;
                    cv.width=Math.max(1,Math.floor(r.width*d));
                    cv.height=Math.max(1,Math.floor(r.height*d));
                    c.setTransform(d,0,0,d,0,0);
                    W=r.width;
                    H=r.height;
                    S=Math.floor(Math.min(W/96,H/54));
                    OX=(W-S*96)/2;
                    OY=(H-S*54)/2;
                draw()
            }
            addEventListener("resize",size,{passive:true});

            function px(x,y,w=1,h=1,col=C.ink){
                c.fillStyle=col;
                c.fillRect(Math.round(OX+x*S),Math.round(OY+y*S),w*S,h*S)
            }

            function line(x0,y0,x1,y1,col=C.ink,t=1){
                x0|=0;y0|=0;x1|=0;y1|=0;
                let 
                    dx=Math.abs(x1-x0),
                    dy=-Math.abs(y1-y0),
                    sx=x0<x1?1:-1,
                    sy=y0<y1?1:-1,
                    e=dx+dy;
                for(;;){
                    px(x0-Math.floor(t/2),y0-Math.floor(t/2),t,t,col);
                    if(x0===x1&&y0===y1)break;
                    let e2=2*e;
                    if(e2>=dy){e+=dy;x0+=sx}
                    if(e2<=dx){e+=dx;y0+=sy}
                }
            }

            function draw101(){
                // Rifle - simple and clear
                // Stock (wooden part)
                px(12,26,20,4,C.body);
                px(12,30,20,1,C.ink);
                // Barrel (metal part)
                line(32,24,62,22,C.ink,8);
                line(32,24,62,22,C.mute,5);
                // Trigger guard
                px(25,31,5,3,C.ink);
                px(26,34,3,1,C.ink);
                // Trigger
                px(27,32,1,2,C.ink);
                // Scope/sight on top
                px(38,20,5,1,C.ink);
                px(38,19,1,3,C.ink);
                px(42,19,1,3,C.ink);
                px(39,21,3,1,C.ink);
                // Gun front sight
                px(60,20,1,3,C.ink);
            }

            function draw(){
                c.clearRect(0,0,W,H);
                c.fillStyle="#fffaf200";
                c.fillRect(0,0,W,H);
                draw101();
            }

            function tick(){
                T++;
                requestAnimationFrame(tick);
            }
            size();
            tick();
        })();
    </script>
</body>
</html>
