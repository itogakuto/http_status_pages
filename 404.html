<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Status</title>
    <style>
        :root{
            --bg:#f5f0e8;
            --ink:#2d2925;
            --muted:#756b61;
            --line:#2d2925;
            --paper:#fffaf2;
            --a:#caa889;
            --b:#efdcb9;
            --g:#798a58;
            --err:#d7b8a7
        }
        *{box-sizing:border-box}html,
        body{height:100%}
        body{
            margin:0;
            background:radial-gradient(circle at 1px 1px,#2d29250a 1px,transparent 0) 0 0/18px 18px,var(--bg);
            color:var(--ink);
            font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
            overflow:hidden
        }
        .wrap{
            min-height:100%;
            display:grid;
            place-items:center;
            padding:clamp(18px,4vw,52px)}main{width:min(100%,980px);
            display:grid;
            gap:clamp(18px,3vw,32px);
            grid-template-columns:minmax(0,1fr);
            align-items:center
        }
        .card{
            position:relative;
            isolation:isolate;
            border:1px solid #2d29252e;
            background:linear-gradient(180deg,#fffaf2d9,#f7eee2cc);
            box-shadow:0 30px 90px #2d292514;
            border-radius:28px;
            padding:clamp(24px,5vw,54px);
            overflow:hidden
        }
        .card:before{
            content:"";
            position:absolute;
            inset:16px;
            border:1px dashed #2d292524;
            border-radius:20px;
            z-index:-1
        }
        .head{
            display:flex;
            justify-content:space-between;
            gap:16px;
            align-items:flex-start;
            margin-bottom:8px
        }
        .brand,
        .code{
            font-size:12px;
            letter-spacing:.18em;
            text-transform:uppercase;
            color:var(--muted)
        }
        .code{
            font-weight:800;
            color:var(--ink)
        }
        .hero{
            display:grid;
            grid-template-columns:1fr;
            gap:22px;
            align-items:center
        }
        .text{
            max-width:590px
        }
        .num{
            font-size:clamp(72px,17vw,180px);
            line-height:.8;
            letter-spacing:-.08em;
            margin:0 0 12px;
            font-weight:900
        }
        .num span{
            display:inline-block;
            transform:translateX(-.04em)
        }
        h1{
            font-size:clamp(24px,4vw,52px);
            line-height:1.05;
            letter-spacing:-.05em;
            margin:0 0 14px
        }
        p{
            font-size:clamp(14px,1.7vw,17px);
            line-height:1.9;
            margin:0;
            color:var(--muted)
        }
        .artbox{
            position:relative;
            min-height:clamp(260px,40vw,430px);
            display:grid;
            place-items:center
        }
        canvas{
            width:100%;
            max-width:720px;
            aspect-ratio:16/9;
            image-rendering:pixelated
        }
        .note{
            position:fixed;
            right:16px;
            bottom:14px;
            font-size:11px;
            letter-spacing:.1em;
            color:#2d29255c
        }
        .hide{
            display:none
            }
        @media (min-width:780px){
            .hero{
                grid-template-columns:.95fr 1.05fr
            }
            .artbox{
                min-height:410px
            }
            .text{
                align-self:end
            }
        }
        @media (max-height:720px){
            body{
                overflow:auto
            }
            .wrap{
                place-items:start center
            }
        }
        @media (prefers-reduced-motion:no-preference){
            .card{
                animation:rise .7s cubic-bezier(.22,1,.36,1) both
            }
            @keyframes rise{from{
                opacity:0;
                transform:translateY(12px)
            }to{
                opacity:1;
                transform:none
            }
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <main class="card" aria-live="polite">
        <div class="head">
            <div class="brand">STATUS PAGE</div>
            <div class="code" id="smallCode">404 NOT FOUND</div>
        </div>
            <section class="hero">
                <div class="text">
                    <p class="brand" id="eyebrow">HTTP STATUS</p>
                        <h2 class="num" id="num"><span>404</span></h2>
                        <h1 id="title">鹿がページを探しています</h1>
                    <p id="message">草</p>
                </div>
                <div class="artbox"><canvas id="art" width="960" height="540" aria-label="ドット絵の鹿"></canvas></div>
            </section>
        </main>
    </div>
    <div class="note">single html / no image</div>
    <script>
        (()=>{
            const txt={
                404:["404 NOT FOUND","鹿がページを探しています","草がないメェ"]
            };
            const raw=
                (location.search+location.hash+location.pathname).toLowerCase(),status=404;
            const 
                el=id=>document.getElementById(id);
                el("smallCode").textContent=txt[status][0];
                el("eyebrow").textContent="HTTP STATUS";
                el("num").innerHTML="<span>"+status+"</span>";
                el("title").textContent=txt[status][1];
                el("message").textContent=txt[status][2];
                document.title=status+" - "+txt[status][0];
            const 
                cv=document.getElementById("art"),
                c=cv.getContext("2d"),
                C={
                    ink:"#2d2925",
                    body:"#caa889",
                    body2:"#d7b993",
                    light:"#efdcb9",
                    grass:"#798a58",
                    paper:"#fffaf2",
                    err:"#d7b8a7",
                    mute:"#756b61"
                };
            let W=960,H=540,S=8,OX=0,OY=0,T=0;

            function size(){
                const 
                    r=cv.getBoundingClientRect(),
                    d=devicePixelRatio||1;
                    cv.width=Math.max(1,Math.floor(r.width*d));
                    cv.height=Math.max(1,Math.floor(r.height*d));
                    c.setTransform(d,0,0,d,0,0);
                    W=r.width;
                    H=r.height;
                    S=Math.floor(Math.min(W/96,H/54));
                    OX=(W-S*96)/2;
                    OY=(H-S*54)/2;
                draw()
            }
            addEventListener("resize",size,{passive:true});

            function px(x,y,w=1,h=1,col=C.ink){
                c.fillStyle=col;
                c.fillRect(Math.round(OX+x*S),Math.round(OY+y*S),w*S,h*S)
            }

            function line(x0,y0,x1,y1,col=C.ink,t=1){
                x0|=0;y0|=0;x1|=0;y1|=0;
                let 
                    dx=Math.abs(x1-x0),
                    dy=-Math.abs(y1-y0),
                    sx=x0<x1?1:-1,
                    sy=y0<y1?1:-1,
                    e=dx+dy;
                for(;;){
                    px(x0-Math.floor(t/2),y0-Math.floor(t/2),t,t,col);
                    if(x0===x1&&y0===y1)break;
                    let e2=2*e;
                    if(e2>=dy){e+=dy;x0+=sx}
                    if(e2<=dx){e+=dx;y0+=sy}
                }
            }
            function runs(a,fill=C.body){
                a.forEach(
                    (r,i)=>{
                        let[x,y,n]=r;
                        if(i===0||i===a.length-1){
                            px(x,y,n,1,C.ink)
                        } else{
                            px(x,y,1,1,C.ink);
                            px(x+1,y,n-2,1,fill);
                            px(x+n-1,y,1,1,C.ink);
                        }
                    }
                )
            }
            function leg(a,b,d,e){
                line(a,b,d,e,C.ink,4);
                line(a,b,d,e,C.body,2);
                px(d-1,e,5,1,C.ink);
                px(d,e-1,3,1,C.light);
            }

            function draw404(){
                const bob=Math.sin(T/22)>0?1:0;

                // ground pixels
                for(let x=6;x<91;x+=4)px(x,46+(x%9===0?1:0),1,1,"#2d29251b");

                [[82,39],[84,38],[86,40],[88,37],[90,39]].forEach(([x,y])=>{line(x,45,x,y,C.grass,1);   
                px(x-1,y,1,1,C.grass)});
                px(81,45,12,1,"#798a5845");
                // deer body based on the supplied side-view sketch, lowered for foraging
                runs([[25,21,29],[22,22,38],[20,23,43],[19,24,46],[18,25,48],[18,26,48],[19,27,46],[20,28,42],[22,29,37],[25,30,29]],C.body);
                px(31,22,17,1,C.light);px(26,28,23,1,C.body2);
                runs([[15,23,7],[14,24,7],[14,25,5],[15,26,3]],C.body);
                px(17,22,3,1,C.ink);
                leg(27,30,22,44);
                leg(33,30,38,44);
                leg(52,30,49,44);
                leg(59,30,69,43);

                // lowered neck and head
                line(59,23,66,31+bob,C.ink,7);
                line(59,23,66,31+bob,C.body,5);
                line(60,23,66,30+bob,C.light,1);
                runs([[64,30+bob,8],[64,31+bob,13],[65,32+bob,16],[66,33+bob,15],[68,34+bob,11],[71,35+bob,6]],C.body);
                px(79,34+bob,2,1,C.ink);px(70,32+bob,1,1,C.ink);
                line(64,30+bob,62,25+bob,C.ink,4);
                line(64,30+bob,62,25+bob,C.body,2);
                line(65,30+bob,69,26+bob,C.ink,3);
                line(65,30+bob,69,26+bob,C.body,1);

                // compact antlers while the deer is crouching
                [[67,29+bob,66,22+bob],[67,25+bob,62,22+bob],[67,24+bob,70,19+bob],[69,27+bob,75,24+bob],[70,23+bob,75,18+bob],[73,24+bob,79,20+bob]].forEach(v=>line(...v,C.ink,3));
                [[67,29+bob,66,22+bob],[67,25+bob,62,22+bob],[67,24+bob,70,19+bob],[69,27+bob,75,24+bob],[70,23+bob,75,18+bob],[73,24+bob,79,20+bob]].forEach(v=>line(...v,C.light,1));
                px(8,11,2,2,C.err);
                px(88,11,1,1,C.err);
                px(12,14,1,1,C.ink);
                px(82,17,2,1,C.ink);
            }
                
            function antlers(cx=48,cy=36,mirror=1){
                const L=(a,b,d,e,t=3)=>{
                    line(cx+a*mirror,cy+b,cx+d*mirror,cy+e,C.ink,t+2);
                    line(cx+a*mirror,cy+b,cx+d*mirror,cy+e,C.light,t);
                };
                L(0,0,8,-8,3);
                L(8,-8,19,-12,3);
                L(19,-12,30,-20,3);
                L(8,-8,8,-22,3);
                L(8,-17,4,-27,2);
                L(15,-10,16,-25,3);
                L(16,-19,21,-31,2);
                L(23,-15,22,-29,3);
                L(22,-23,28,-33,2);
                L(29,-19,37,-22,3);
                L(36,-22,42,-31,2);
                L(29,-20,32,-9,2);
                L(4,-4,12,-2,2);
            }

            function draw(){
                c.clearRect(0,0,W,H);
                c.fillStyle="#fffaf200";
                c.fillRect(0,0,W,H);
                draw404();
            }

            function tick(){
                T++;
                if(status===404&&T%6===0)draw();
                requestAnimationFrame(tick);
            }
            size();
            tick();
        })();
    </script>
</body>
</html>
